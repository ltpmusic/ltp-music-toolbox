const $=x=>document.getElementById(x),names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'],tools=['🎸 Tuner','⏱ Metronome','🥁 Drum Machine','🎸 Guitar Chords','🎹 Piano Chords','🎼 Scale Explorer','👂 Ear Training','🔑 Transposer','🎷 Jazz Player','🎧 Loop Trainer','🎤 Pitch Monitor','🎶 Tap Tempo'];let ac,timer,stream,raf,audio,epoch=0;function stop(){epoch++;clearInterval(timer);cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());audio?.pause();if(ac){ac.close();ac=null}}function ctx(){return ac??=new AudioContext()}function tone(m,d=.25,when=0,type='sine',vol=.15){let a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+when;o.type=type;o.frequency.value=440*2**((m-69)/12);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}const opts=(a)=>a.map((x,i)=>`<option value="${i}">${x}</option>`).join(''),root=`<label>Root <select id=r>${opts(names)}</select></label>`,bpm=`<label>BPM <input id=b type=number min=30 max=300 value=100></label>`,out='<output id=o>Ready</output>',btn=(s,id)=>`<button id=${id}>${s}</button>`,val=id=>+$(id).value,show=s=>$('o').textContent=s,tempo=()=>Math.max(30,Math.min(300,val('b')||100));function repeat(fn,ms){clearInterval(timer);fn();timer=setInterval(fn,ms)}function chord(){let r=val('r'),q=val('q');return [0,4,7,10].map((x,i)=>[ [0,4,7],[0,3,7],[0,4,7,10],[0,4,7,11],[0,3,7,10],[0,3,6,10],[0,3,6,9] ][q][i]).filter(x=>x!==undefined).map(x=>r+x)}const quality='<label>Quality <select id=q>'+opts(['Major','Minor','7','maj7','m7','m7♭5','dim7'])+'</select></label>';function open(i){stop();$('p').innerHTML='<h2>'+tools[i]+'</h2>';let p=$('p');function add(s){p.innerHTML+=s}if(i===0||i===10){add(btn('Start microphone','go')+out+'<canvas id=c width=600 height=150></canvas>');$('go').onclick=async()=>{stop();let e=epoch;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Open directly on HTTPS');let s=await navigator.mediaDevices.getUs ('f').onchange=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL($('f').files[0]);audio.src=url};$('s').oninput=()=>audio.playbackRate=val('s');$('aa').onclick=()=>{A=audio.currentTime;show('A '+A.toFixed(2))};$('bb').onclick=()=>{B=audio.currentTime;show('B '+B.toFixed(2))};$('go').onclick=()=>{on=!on&&B>A;show(on?'Loop enabled':'Loop off / set A and B')};audio.ontimeupdate=()=>{if(on&&audio.currentTime>=B)audio.currentTime=A}}else{add(btn('TAP','go')+out);let times=[];$('go').onclick=()=>{let t=performance.now();if(t-times.at(-1)>2500)times=[];times.push(t);if(times.length>8)times.shift();show(times.length>1?(60000*(times.length-1)/(t-times[0])).toFixed(1)+' BPM':'Tap again')}}let s=document.createElement('button');s.textContent='Stop audio';s.onclick=stop;p.append(s)}tools.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>open(i);$('n').append(b)});open(0);</script></html>
